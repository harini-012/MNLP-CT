<!DOCTYPE html>
<html>

<head>
    <title>College Feedback Analyzer</title>

    <style>
        body {
            font-family: Arial;
            max-width: 700px;
            margin: 60px auto;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

    <h1>College Feedback Analyzer</h1>

    <p>Enter student feedback:</p>

    <textarea id="feedback"
        placeholder="Enter your feedback here..."></textarea>

    <br>

    <button onclick="analyzeFeedback()">
        Analyze Feedback
    </button>

    <div id="result"></div>


    <script>

        async function analyzeFeedback() {

            const text =
                document.getElementById("feedback").value;

            if (!text.trim()) {
                alert("Please enter feedback.");
                return;
            }

            const response = await fetch(
                "http://127.0.0.1:8000/analyze",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        text: text
                    })
                }
            );

            const data = await response.json();

            document.getElementById("result").innerHTML = `
                <h2>Analysis Result</h2>

                <p>
                    <strong>Feedback:</strong>
                    ${data.text}
                </p>

                <p>
                    <strong>Sentiment:</strong>
                    ${data.sentiment}
                </p>

                <p>
                    <strong>Confidence:</strong>
                    ${data.confidence}%
                </p>
            `;
        }

    </script>

</body>

</html>
