<!DOCTYPE html>
<html>

<head>
    <title>College Feedback Analyzer</title>

    <style>
        body {
            font-family: Arial;
            max-width: 700px;
            margin: 60px auto;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ccc;
        }
        table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th,
td {
    border: 1px solid #ccc;
    padding: 12px;
    text-align: left;
}

th {
    width: 30%;
    background-color: #f2f2f2;
}

td {
    background-color: white;
}

#result {
    margin-top: 25px;
    padding: 20px;
    border: 1px solid #ccc;
}
    </style>
</head>

<body>

    <h1>College Feedback Analyzer</h1>

    <p>Enter student feedback:</p>

    <textarea id="feedback"
        placeholder="Enter your feedback here..."></textarea>

    <br>

    <button onclick="analyzeFeedback()">
        Analyze Feedback
    </button>

   <div id="result"></div>

<script>

async function analyzeFeedback() {

    const text =
        document.getElementById("feedback").value;

    if (!text.trim()) {
        alert("Please enter feedback.");
        return;
    }

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/analyze",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    text: text
                })
            }
        );

        const data = await response.json();

        document.getElementById("result").innerHTML = `

            <h2>Analysis Result</h2>

            <table>

                <tr>
                    <th>Feedback</th>
                    <td>${data.text}</td>
                </tr>

                <tr>
                    <th>Sentiment</th>
                    <td>
                        <strong>${data.sentiment}</strong>
                    </td>
                </tr>

                <tr>
                    <th>Confidence</th>
                    <td>
                        <strong>${data.confidence}%</strong>
                    </td>
                </tr>

                <tr>
                    <th>Category</th>
                    <td>
                        <strong>${data.category}</strong>
                    </td>
                </tr>

                <tr>
                    <th>Emotion</th>
                    <td>
                        <strong>${data.emotion}</strong>
                    </td>
                </tr>

                <tr>
                    <th>Keywords</th>
                    <td>
                        <strong>${data.keywords}</strong>
                    </td>
                </tr>

                <tr>
                    <th>Word Count</th>
                    <td>
                        <strong>${data.word_count}</strong>
                    </td>
                </tr>

                <tr>
                    <th>Recommendation</th>
                    <td>
                        <strong>${data.recommendation}</strong>
                    </td>
                </tr>

                <tr>
                    <th>Priority</th>
                    <td>
                        <strong>${data.priority}</strong>
                    </td>
                </tr>

            </table>
        `;

    } catch (error) {

        document.getElementById("result").innerHTML = `
            <p style="color:red;">
                Error connecting to the FastAPI server.
            </p>
        `;

        console.error(error);
    }
}

</script>
</body>

</html>
